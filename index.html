<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最后的展品 - 谋杀推理游戏</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="terminal">
    <div class="topbar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="top-title">侦探终端 // 案件 047 - 最后的展品</span>
    </div>

    <div class="content">
<pre class="ascii-title">
    最 后 的 展 品
    谋 杀 推 理 游 戏
</pre>

        <div id="output"></div>

        <form id="commandForm" class="input-row">
            <span class="prompt">&gt;</span>
            <input id="commandInput" autocomplete="off" spellcheck="false"
                   autocapitalize="off" enterkeyhint="send"
                     placeholder="输入“帮助”查看可用命令..." autofocus>
                 <button class="command-submit" type="submit">发送</button>
        </form>
    </div>

    <div class="bottom">
        <span id="status">案件状态：进行中</span>
        <button id="languageToggle" type="button" onclick="switchLanguage()">English</button>
        <button id="restartButton" onclick="restartGame()">重启案件</button>
    </div>
</div>

<div id="saveDialog" class="save-dialog" role="dialog" aria-modal="true" aria-labelledby="saveDialogTitle">
    <section class="save-panel">
        <div class="save-dialog-heading">
            <h1 id="saveDialogTitle">选择案件</h1>
            <button id="dialogLanguageToggle" type="button" onclick="switchLanguage()">English</button>
        </div>
        <p id="saveDialogDescription">为新案件命名，或载入之前保存的案件。</p>
        <form id="saveForm" class="save-form">
            <input id="saveName" maxlength="40" autocomplete="off" placeholder="新案件名称" required>
            <button id="createSaveButton" type="submit">开始新案件</button>
        </form>
        <div id="saveList" class="save-list"></div>
    </section>
</div>

<script src="stories/catalog.js"></script>
<script src="save-manager.js"></script>
<script src="stories/missing-sapphire.js"></script>
<script src="stories/last-exhibit.js"></script>
</body>
</html>
